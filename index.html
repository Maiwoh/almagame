
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiempo Real</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#06162d,#0b477d);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.app{
    width:100%;
    max-width:500px;
    background:rgba(0,0,0,.38);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.header{
    text-align:center;
    margin-bottom:22px;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.sub{
    color:#aebfd0;
    margin-top:6px;
}

.search{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.search input{
    flex:1;
    min-width:0;
    border:0;
    outline:none;
    padding:15px;
    border-radius:14px;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:15px;
}

.search input::placeholder{
    color:#9fb0c1;
}

.search button{
    width:auto;
    margin:0;
    padding:0 17px;
}

button{
    border:0;
    border-radius:14px;
    background:#1683ff;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#056edb;
}

.location{
    text-align:center;
    margin-bottom:20px;
}

.country{
    font-size:29px;
    font-weight:bold;
}

.city{
    color:#aebfd0;
    margin-top:6px;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.card{
    background:rgba(255,255,255,.08);
    border-radius:18px;
    padding:18px 10px;
    text-align:center;
}

.card-title{
    color:#aebfd0;
    font-size:14px;
    margin-bottom:8px;
}

.card-value{
    font-size:20px;
    font-weight:bold;
}

.weather{
    margin-top:18px;
    text-align:center;
    background:rgba(255,255,255,.08);
    border-radius:22px;
    padding:24px;
}

.icon{
    font-size:70px;
}

.condition{
    font-size:24px;
    font-weight:bold;
    margin-top:5px;
}

.big-temperature{
    font-size:52px;
    font-weight:bold;
    margin:7px 0;
}

.feels{
    color:#b9c8d7;
}

.status{
    text-align:center;
    margin-top:18px;
    color:#8fa8bd;
    font-size:13px;
}

.location-button{
    width:100%;
    margin-top:18px;
    padding:15px;
}

.error{
    display:none;
    text-align:center;
    color:#ffb4b4;
    margin-top:15px;
    font-size:14px;
}

.loading{
    opacity:.6;
    pointer-events:none;
}

@media(max-width:430px){

    .app{
        padding:20px;
    }

    .country{
        font-size:25px;
    }

    .card-value{
        font-size:18px;
    }

}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🌎 Tiempo Real</div>
        <div class="sub">Consulta el clima de cualquier lugar</div>
    </div>


    <!-- BUSCADOR -->

    <div class="search">

        <input
            id="searchInput"
            type="text"
            placeholder="🔎 Buscar país o ciudad..."
            autocomplete="off"
        >

        <button onclick="searchPlace()">
            Buscar
        </button>

    </div>


    <!-- UBICACIÓN -->

    <div class="location">

        <div class="country" id="country">
            Detectando ubicación...
        </div>

        <div class="city" id="city">
            ---
        </div>

    </div>


    <!-- INFORMACIÓN -->

    <div class="info">

        <div class="card">
            <div class="card-title">🕐 Hora</div>
            <div class="card-value" id="clock">--:--:--</div>
        </div>

        <div class="card">
            <div class="card-title">📅 Día</div>
            <div class="card-value" id="day">---</div>
        </div>

        <div class="card">
            <div class="card-title">🗓️ Fecha</div>
            <div class="card-value" id="date">--/--/----</div>
        </div>

        <div class="card">
            <div class="card-title">🌡️ Temperatura</div>
            <div class="card-value" id="temperature">--°C</div>
        </div>

        <div class="card">
            <div class="card-title">💨 Viento</div>
            <div class="card-value" id="wind">-- km/h</div>
        </div>

        <div class="card">
            <div class="card-title">🌞 Momento</div>
            <div class="card-value" id="dayNight">---</div>
        </div>

    </div>


    <!-- CLIMA -->

    <div class="weather">

        <div class="icon" id="weatherIcon">
            🌎
        </div>

        <div class="condition" id="condition">
            Clima
        </div>

        <div class="big-temperature" id="bigTemperature">
            --°C
        </div>

        <div class="feels" id="feels">
            Sensación térmica: --°
        </div>

    </div>


    <button
        class="location-button"
        onclick="startLocation()"
    >
        📍 Volver a mi ubicación
    </button>


    <div class="status" id="status">
        Detectando ubicación...
    </div>

    <div class="error" id="error"></div>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let currentTimezone = null;
let clockTimer = null;


/* =====================================================
   RELOJ
===================================================== */

function updateClock(){

    if(!currentTimezone){

        const now = new Date();

        document.getElementById("clock").textContent =
            now.toLocaleTimeString("es-UY",{
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            });

        return;
    }


    const now = new Date();


    const time =
        new Intl.DateTimeFormat("es-ES",{
            timeZone:currentTimezone,
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        }).format(now);


    const day =
        new Intl.DateTimeFormat("es-ES",{
            timeZone:currentTimezone,
            weekday:"long"
        }).format(now);


    const date =
        new Intl.DateTimeFormat("es-ES",{
            timeZone:currentTimezone,
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }).format(now);


    const hour =
        Number(
            new Intl.DateTimeFormat("en-US",{
                timeZone:currentTimezone,
                hour:"numeric",
                hour12:false
            }).format(now)
        );


    document.getElementById("clock").textContent =
        time;

    document.getElementById("day").textContent =
        capitalize(day);

    document.getElementById("date").textContent =
        date;


    if(hour >= 6 && hour < 19){

        document.getElementById("dayNight").textContent =
            "☀️ De día";

    }else{

        document.getElementById("dayNight").textContent =
            "🌙 De noche";
    }

}


/* Actualizar cada segundo */

setInterval(updateClock,1000);


/* =====================================================
   DETECTAR MI UBICACIÓN
===================================================== */

function startLocation(){

    hideError();

    if(!navigator.geolocation){

        showError(
            "Tu navegador no permite detectar tu ubicación."
        );

        return;
    }


    document.getElementById("status").textContent =
        "📍 Detectando tu ubicación...";


    navigator.geolocation.getCurrentPosition(

        position => {

            const lat =
                position.coords.latitude;

            const lon =
                position.coords.longitude;


            getMyLocation(lat,lon);

        },

        error => {

            showError(
                "Permití el acceso a tu ubicación para usar esta función."
            );

        },

        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:300000
        }
    );
}


/* =====================================================
   OBTENER MI PAÍS
===================================================== */

async function getMyLocation(lat,lon){

    try{

        const response =
            await fetch(
                `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=es`
            );


        const data =
            await response.json();


        const address =
            data.address || {};


        const country =
            address.country ||
            "Tu país";


        const city =
            address.city ||
            address.town ||
            address.village ||
            address.municipality ||
            "Tu ubicación";


        document.getElementById("country").textContent =
            "En " + country;


        document.getElementById("city").textContent =
            "📍 " + city;


        getWeather(lat,lon,country,city);

    }catch(error){

        showError(
            "No se pudo detectar tu ubicación."
        );
    }
}


/* =====================================================
   BUSCAR PAÍS O CIUDAD
===================================================== */

async function searchPlace(){

    hideError();


    const input =
        document.getElementById("searchInput");


    const query =
        input.value.trim();


    if(!query){

        showError(
            "Escribí un país o una ciudad."
        );

        return;
    }


    document.getElementById("status").textContent =
        "🔎 Buscando " + query + "...";


    try{

        const response =
            await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=es&format=json`
            );


        const data =
            await response.json();


        if(!data.results || data.results.length === 0){

            showError(
                "No encontramos ese lugar."
            );

            return;
        }


        /*
           Tomamos el primer resultado encontrado.
        */

        const place =
            data.results[0];


        const lat =
            place.latitude;

        const lon =
            place.longitude;


        const name =
            place.name ||
            query;


        const country =
            place.country ||
            "Lugar seleccionado";


        currentTimezone =
            place.timezone ||
            "UTC";


        document.getElementById("country").textContent =
            "En " + country;


        document.getElementById("city").textContent =
            "📍 " + name;


        getWeather(
            lat,
            lon,
            country,
            name
        );


        document.getElementById("status").textContent =
            "✓ Mostrando información de " + name;


        updateClock();


    }catch(error){

        console.error(error);

        showError(
            "No se pudo realizar la búsqueda."
        );
    }

}


/* =====================================================
   CLIMA
===================================================== */

async function getWeather(
    latitude,
    longitude,
    country,
    city
){

    try{

        document.getElementById("status").textContent =
            "🌤️ Actualizando clima...";


        const url =
            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`;


        const response =
            await fetch(url);


        const data =
            await response.json();


        const current =
            data.current;


        /*
           Guardamos la zona horaria
           entregada por el clima.
        */

        if(data.timezone){

            currentTimezone =
                data.timezone;

            updateClock();
        }


        const temperature =
            Math.round(
                current.temperature_2m
            );


        const feels =
            Math.round(
                current.apparent_temperature
            );


        const wind =
            Math.round(
                current.wind_speed_10m
            );


        document.getElementById("temperature").textContent =
            temperature + "°C";


        document.getElementById("bigTemperature").textContent =
            temperature + "°C";


        document.getElementById("feels").textContent =
            "Sensación térmica: " +
            feels +
            "°C";


        document.getElementById("wind").textContent =
            wind +
            " km/h";


        const weather =
            getWeatherDescription(
                current.weather_code,
                current.is_day
            );


        document.getElementById("weatherIcon").textContent =
            weather.icon;


        document.getElementById("condition").textContent =
            weather.text;


        if(current.is_day){

            document.getElementById("dayNight").textContent =
                "☀️ De día";

        }else{

            document.getElementById("dayNight").textContent =
                "🌙 De noche";
        }


        document.getElementById("status").textContent =
            "✓ Información actualizada";

    }catch(error){

        console.error(error);

        showError(
            "No se pudo obtener el clima."
        );
    }
}


/* =====================================================
   DESCRIPCIÓN DEL CLIMA
===================================================== */

function getWeatherDescription(code,isDay){

    if(code === 0){

        return {
            icon:isDay ? "☀️" : "🌙",
            text:isDay
                ? "Soleado"
                : "Cielo despejado"
        };
    }


    if(code === 1 || code === 2){

        return {
            icon:isDay ? "🌤️" : "☁️",
            text:"Parcialmente nublado"
        };
    }


    if(code === 3){

        return {
            icon:"☁️",
            text:"Nublado"
        };
    }


    if(code === 45 || code === 48){

        return {
            icon:"🌫️",
            text:"Neblina"
        };
    }


    if(
        code === 51 ||
        code === 53 ||
        code === 55 ||
        code === 56 ||
        code === 57
    ){

        return {
            icon:"🌦️",
            text:"Llovizna"
        };
    }


    if(
        code === 61 ||
        code === 63 ||
        code === 65 ||
        code === 66 ||
        code === 67
    ){

        return {
            icon:"🌧️",
            text:"Lluvia"
        };
    }


    if(
        code === 71 ||
        code === 73 ||
        code === 75 ||
        code === 77
    ){

        return {
            icon:"❄️",
            text:"Nieve"
        };
    }


    if(
        code === 80 ||
        code === 81 ||
        code === 82
    ){

        return {
            icon:"🌧️",
            text:"Chubascos"
        };
    }


    if(
        code === 95 ||
        code === 96 ||
        code === 99
    ){

        return {
            icon:"⛈️",
            text:"Tormenta"
        };
    }


    return {
        icon:"🌎",
        text:"Condiciones desconocidas"
    };

}


/* =====================================================
   UTILIDADES
===================================================== */

function capitalize(text){

    if(!text) return "";

    return text.charAt(0).toUpperCase() +
           text.slice(1);
}


function showError(message){

    const error =
        document.getElementById("error");

    error.textContent =
        "⚠️ " + message;

    error.style.display =
        "block";

    document.getElementById("status").textContent =
        "⚠️ No se pudo actualizar";
}


function hideError(){

    document.getElementById("error").style.display =
        "none";
}


/* =====================================================
   ENTER PARA BUSCAR
===================================================== */

document
.getElementById("searchInput")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        searchPlace();

    }

});


/* =====================================================
   INICIAR
===================================================== */

startLocation();

</script>

</body>
</html>
